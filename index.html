<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Grande Prêmio do Tito</title>
<link rel="stylesheet" href="style.css">
<main>
  <header>
    <img src="assets/tito-pista.webp" alt="Carneirinho piloto no carro verde número 95, cruzando a linha de chegada">
    <div>
      <h1>Grande Prêmio do Tito</h1>
      <p>Vai ser muito especial receber vocês para conhecer o Tito!</p>
      <p><strong>São Luiz Anália Franco</strong><br>Visitas de 30 minutos, com até 4 pessoas por horário.</p>
    </div>
  </header>
  <section aria-labelledby="title">
    <h2 id="title">Visitas à maternidade</h2>
    <form id="group-form">
      <label>Seu nome e sobrenome <input name="visitor" required maxlength="100" autocomplete="name"></label>
      <label>Pessoas no grupo, incluindo você
        <select name="guests"><option>1</option><option>2</option><option>3</option><option>4</option></select>
      </label>
      <div id="companions"></div>
      <button>Ver horários disponíveis</button>
    </form>
    <p id="availability" role="status"></p>
    <form id="booking" hidden>
      <p id="group-summary"></p>
      <label>Horário disponível <select name="slot" required></select></label>
      <button>Confirmar visita</button>
    </form>
    <button type="button" id="edit-group" hidden>Editar dados do grupo</button>
    <p id="feedback" role="status"></p>
    <div id="receipt" hidden>
      <p id="details"></p>
      <p>Guarde o link da reserva para cancelar se precisar.</p>
      <label>Link da reserva <input id="reservation-link" readonly></label>
      <button type="button" id="calendar">Adicionar ao calendário</button>
      <button type="button" id="change">Trocar horário</button>
      <form id="change-form" hidden>
        <label>Novo horário <select name="slot" required></select></label>
        <button>Confirmar novo horário</button>
      </form>
      <button id="cancel">Cancelar visita</button>
    </div>
  </section>
  <footer><a href="agenda.html">Agenda da família</a></footer>
</main>
<script type="module" src="visit.js?v=3"></script>
</html>
